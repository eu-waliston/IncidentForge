services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: incidentforge
    volumes:
      - incidentforge_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/incidentforge
      HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - incidentforge_evidence:/app/var/evidence

volumes:
  incidentforge_mongo:
  incidentforge_evidence:
